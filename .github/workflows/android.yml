name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du moteur de jeu
        run: ./gradlew :game:test

      - name: Compilation de l'APK de test
        run: ./gradlew :app:assembleDebug

      - name: Publication de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: crazy-goose-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: game/build/reports/tests/
